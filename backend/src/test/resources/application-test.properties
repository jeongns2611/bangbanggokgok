spring.application.name=backend
# H2 test DB
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Flyway
spring.flyway.enabled=false
# OAuth / JWT dummy values
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
jwt.secret=test-jwt-secret-test-jwt-secret-test-jwt-secret
# Redis dummy values
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
# External API dummy values
odsay.api.key=test-odsay-key
kakao.api.key=test-kakao-key
# AI dummy values
spring.ai.openai.api-key=test-ai-key
spring.ai.openai.base-url=http://localhost:18080
reranker.base-url=http://localhost:8000
reranker.timeout-ms=30000
reranker.retry-count=2
reranker.retry-delay-ms=50
# Cache / logging
spring.cache.type=none
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true