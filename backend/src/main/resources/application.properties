spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:.env[.properties],optional:file:${user.dir}/.env[.properties]
# PostgreSQL
spring.datasource.primary.jdbc-url=${DB_URL}
spring.datasource.primary.username=${DB_USERNAME}
spring.datasource.primary.password=${DB_PASSWORD}
spring.datasource.primary.driver-class-name=org.postgresql.Driver
# PgVector
spring.datasource.secondary.jdbc-url=${SECONDARY_URL}
spring.datasource.secondary.username=${SECONDARY_USERNAME}
spring.datasource.secondary.password=${SECONDARY_PASSWORD}
spring.datasource.secondary.driver-class-name=org.postgresql.Driver
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway
spring.flyway.enabled=false
spring.flyway.locations=filesystem:./db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.sql-migration-prefix=v
spring.flyway.sql-migration-separator=_
spring.flyway.sql-migration-suffixes=.sql
spring.flyway.validate-migration-naming=true
# Logging on
#logging.level.org.hibernate.SQL=info
#logging.level.org.hibernate.orm.jdbc.bind=trace
# Logging off
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Odsay
odsay.api.key=${ODSAY_API_KEY}
# OpenAPI Real Estate
openapi.real-estate.key=${OPENAPI_REAL_ESTATE_KEY:}
# Kakao
kakao.api.key=${KAKAO_API_KEY}
# S3
aws.s3.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET_NAME}
aws.accessKey=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.cloudfront.url=${AWS_CLOUDFRONT_URL}
# AI
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL}
# MCP Server
spring.ai.mcp.server.transport=STDIO
spring.ai.mcp.server.title=Real-Estate-MCP-Server
spring.ai.mcp.server.version=1.1.2
spring.main.banner-mode=off
logging.file.name=logs/mcp-server.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=WARN 
logging.level.com.ssafy.backend.domain.ai.service=DEBUG
# Spring Data Redis
logging.level.org.springframework.data.redis=INFO
# Lettuce (GET, SET, DEL, EVAL)
logging.level.io.lettuce.core.protocol=INFO
reranker.base-url=${RERANKER_BASE_URL:http://localhost:8000}
# HDFS
hadoop.hdfs.webhdfs-url=${HDFS_WEBHDFS_URL}
hadoop.hdfs.user=${HDFS_USER}
reranker.timeout-ms=30000
reranker.retry-count=2
reranker.retry-delay-ms=200
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
